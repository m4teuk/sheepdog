[project]
name = "sheepdog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mateusz Kussowski", email = "mateusz.kussowski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "numpy>=2.5.4",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
